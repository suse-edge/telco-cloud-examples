apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: default
  labels:
    cluster-api.cattle.io/rancher-auto-import: "true"
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 192.168.0.0/18
    services:
      cidrBlocks:
      - 10.96.0.0/12
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: RKE2ControlPlane
    name: ${CLUSTER_NAME}
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: Metal3Cluster
    name: ${CLUSTER_NAME}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: Metal3Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: default
spec:
  controlPlaneEndpoint:
    host: ${VIP_ADDRESS}
    port: 6443
  cloudProviderEnabled: false
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: RKE2ControlPlane
metadata:
  name: ${CLUSTER_NAME}
  namespace: default
  annotations:
    rke2.controlplane.cluster.x-k8s.io/load-balancer-exclusion: "true"
spec:
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: Metal3MachineTemplate
        name: ${CLUSTER_NAME}-controlplane
  replicas: 3
  version: ${RKE2_VERSION}
  rolloutStrategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxSurge: 0
  registrationMethod: "control-plane-endpoint"
  serverConfig:
    cni: calico
    tlsSan:
      - ${VIP_ADDRESS}
  agentConfig:
    format: ignition
    additionalUserData:
      config: |
        variant: fcos
        version: 1.4.0
        storage:
          files:
            - path: /var/lib/rancher/rke2/server/manifests/00-endpoint-copier-operator.yaml
              overwrite: true
              contents:
                inline: |
                  apiVersion: helm.cattle.io/v1
                  kind: HelmChart
                  metadata:
                    name: endpoint-copier-operator
                    namespace: kube-system
                  spec:
                    chart: oci://registry.suse.com/edge/charts/endpoint-copier-operator
                    targetNamespace: endpoint-copier-operator
                    version: 306.0.4+up1.6.0
                    createNamespace: true
              mode: 0644
              user:
                name: root
              group:
                name: root
            - path: /var/lib/rancher/rke2/server/manifests/01-metallb.yaml
              overwrite: true
              contents:
                inline: |
                  apiVersion: helm.cattle.io/v1
                  kind: HelmChart
                  metadata:
                    name: metallb
                    namespace: kube-system
                  spec:
                    chart: oci://registry.suse.com/edge/charts/metallb
                    targetNamespace: metallb-system
                    version: 306.0.2+up0.15.3
                    createNamespace: true
              mode: 0644
              user:
                name: root
              group:
                name: root
            - path: /var/lib/rancher/rke2/server/manifests/02-metallb-cr.yaml
              overwrite: true
              contents:
                inline: |
                  apiVersion: metallb.io/v1beta1
                  kind: IPAddressPool
                  metadata:
                    name: kubernetes-vip-ip-pool
                    namespace: metallb-system
                  spec:
                    addresses:
                      - ${VIP_ADDRESS}/32
                    serviceAllocation:
                      priority: 100
                      namespaces:
                        - default
                      serviceSelectors:
                        - matchExpressions:
                          - {key: "serviceType", operator: In, values: [kubernetes-vip]}
                  ---
                  apiVersion: metallb.io/v1beta1
                  kind: L2Advertisement
                  metadata:
                    name: ip-pool-l2-adv
                    namespace: metallb-system
                  spec:
                    ipAddressPools:
                      - kubernetes-vip-ip-pool
              mode: 0644
              user:
                name: root
              group:
                name: root
            - path: /var/lib/rancher/rke2/server/manifests/03-endpoint-svc.yaml
              overwrite: true
              contents:
                inline: |
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: kubernetes-vip
                    namespace: default
                    labels:
                      serviceType: kubernetes-vip
                  spec:
                    ports:
                    - name: rke2-api
                      port: 9345
                      protocol: TCP
                      targetPort: 9345
                    - name: k8s-api
                      port: 6443
                      protocol: TCP
                      targetPort: 6443
                    type: LoadBalancer
              mode: 0644
              user:
                name: root
              group:
                name: root
            - path: /var/lib/rancher/rke2/server/manifests/04-longhorn-namespace.yaml
              overwrite: true
              contents:
                inline: |
                  apiVersion: v1
                  kind: Namespace
                  metadata:
                    name: longhorn-system
              mode: 0644
              user:
                name: root
              group:
                name: root
            - path: /var/lib/rancher/rke2/server/manifests/05-longhorn-helm-auth.yaml
              overwrite: true
              contents:
                inline: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: longhorn-registry
                    namespace: kube-system
                  type: kubernetes.io/dockerconfigjson
                  data:
                    .dockerconfigjson: ${DP_APPS_RANCHER_SECRET}
              mode: 0644
              user:
                name: root
              group:
                name: root
            - path: /var/lib/rancher/rke2/server/manifests/06-longhorn-auth.yaml
              overwrite: true
              contents:
                inline: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: longhorn-registry
                    namespace: longhorn-system
                  type: kubernetes.io/dockerconfigjson
                  data:
                    .dockerconfigjson: ${DP_APPS_RANCHER_SECRET}
              mode: 0644
              user:
                name: root
              group:
                name: root
            - path: /var/lib/rancher/rke2/server/manifests/07-longhorn.yaml
              overwrite: true
              contents:
                inline: |
                  apiVersion: helm.cattle.io/v1
                  kind: HelmChart
                  metadata:
                    name: suse-storage
                    namespace: kube-system
                  spec:
                    chart: oci://dp.apps.rancher.io/charts/suse-storage
                    dockerRegistrySecret:
                      name: longhorn-registry
                    targetNamespace: longhorn-system
                    version: 1.11.1
                    createNamespace: true
                    valuesContent: |-
                      privateRegistry:
                        registryUrl: dp.apps.rancher.io
                        registrySecret: longhorn-registry
                      global:
                        cattle:
                          systemDefaultRegistry: dp.apps.rancher.io
                      imagePullSecrets:
                        - name: longhorn-registry
                      defaultSettings:
                        nodeDrainPolicy: "always-allow"
                        replicaReplenishmentWaitInterval: 300
                        autoDeletePodWhenVolumeDetachedUnexpectedly: true
                      persistence:
                        defaultClass: false
                        defaultClassReplicaCount: 3
                        defaultDataLocality: best-effort
                        reclaimPolicy: Retain
                      longhornManager:
                        imagePullSecrets:
                          - name: longhorn-registry
                        resources:
                          limits:
                            memory: 512Mi
                          requests:
                            cpu: 100m
                            memory: 256Mi
                        tolerations:
                          - key: "node-role.kubernetes.io/control-plane"
                            operator: "Exists"
                            effect: "NoSchedule"
                      longhornDriver:
                        imagePullSecrets:
                          - name: longhorn-registry
                        resources:
                          limits:
                            memory: 256Mi
                          requests:
                            cpu: 50m
                            memory: 128Mi
                        tolerations:
                          - key: "node-role.kubernetes.io/control-plane"
                            operator: "Exists"
                            effect: "NoSchedule"
                      longhornUI:
                        imagePullSecrets:
                          - name: longhorn-registry
              mode: 0644
              user:
                name: root
              group:
                name: root
            - path: /var/lib/rancher/rke2/server/manifests/08-longhorn-storageclass.yaml
              overwrite: true
              contents:
                inline: |
                  apiVersion: storage.k8s.io/v1
                  kind: StorageClass
                  metadata:
                    name: longhorn
                    annotations:
                      storageclass.kubernetes.io/is-default-class: "true"
                  provisioner: driver.longhorn.io
                  allowVolumeExpansion: true
                  reclaimPolicy: Retain
                  volumeBindingMode: Immediate
                  parameters:
                    numberOfReplicas: "3"
                    staleReplicaTimeout: "60"
                    dataLocality: "best-effort"
                    fsType: "ext4"
                    fromBackup: ""
                    disableRevisionCounter: "true"
              mode: 0644
              user:
                name: root
              group:
                name: root
        systemd:
          units:
            - name: rke2-preinstall.service
              enabled: true
              contents: |
                [Unit]
                Description=rke2-preinstall
                Wants=network-online.target
                Before=rke2-install.service
                ConditionPathExists=!/run/cluster-api/bootstrap-success.complete
                [Service]
                Type=oneshot
                User=root
                ExecStartPre=/bin/sh -c "mount -L config-2 /mnt"
                # Note we use _ as a delimiter for sed here because the providerid includes / characters
                ExecStart=/bin/sh -c "sed -i \"s_PROVIDERID_$(jq -r .providerid /mnt/openstack/latest/meta_data.json)_\" /etc/rancher/rke2/config.yaml"
                ExecStart=/bin/sh -c "echo \"node-name: $(jq -r .name /mnt/openstack/latest/meta_data.json)\" >> /etc/rancher/rke2/config.yaml"
                ExecStart=/bin/sh -c "echo \"node-label:\" >> /etc/rancher/rke2/config.yaml"
                ExecStart=/bin/sh -c "echo \"  - metal3.io/uuid=$(jq -r .uuid /mnt/openstack/latest/meta_data.json)\" >> /etc/rancher/rke2/config.yaml"
                ExecStartPost=/bin/sh -c "umount /mnt"
                [Install]
                WantedBy=multi-user.target
    kubelet:
      extraArgs:
        - provider-id=metal3://PROVIDERID
    nodeName: "localhost.localdomain"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: Metal3MachineTemplate
metadata:
  name: ${CLUSTER_NAME}-controlplane
  namespace: default
spec:
  nodeReuse: true
  template:
    spec:
      dataTemplate:
        name: ${CLUSTER_NAME}-controlplane-template
      hostSelector:
        matchLabels:
          cluster-role: control-plane
      automatedCleaningMode: disabled
      image:
        checksum: ${IMAGE_CHECKSUM_URL}
        checksumType: sha256
        format: raw
        url: ${IMAGE_URL}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: Metal3DataTemplate
metadata:
  name: ${CLUSTER_NAME}-controlplane-template
  namespace: default
spec:
  clusterName: ${CLUSTER_NAME}
  metaData:
    objectNames:
      - key: name
        object: machine
      - key: local-hostname
        object: machine
      - key: local_hostname
        object: machine
