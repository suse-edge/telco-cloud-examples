    - name: registry.rancher.com/rancher/mirrored-sig-storage-snapshot-controller:v8.2.0
    - name: registry.rancher.com/rancher/neuvector-compliance-config:1.0.16
    - name: registry.rancher.com/rancher/neuvector-controller:5.6.1
